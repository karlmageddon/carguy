name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run ruff check .
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate --spec ios/project.yml
      - name: Select available iPhone simulator
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"
      - run: xcodebuild -project ios/Carguy.xcodeproj -scheme Carguy -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -resultBundlePath /tmp/CarguyTests.xcresult CODE_SIGNING_ALLOWED=NO test
  deployment-changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CARGUY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changes to the backend image or deployment
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo 'backend=true' >> "$GITHUB_OUTPUT"
          else
            # Exit 1 means changed; other errors must fail rather than deploy.
            status=0
            git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- \
              carguy/ Dockerfile pyproject.toml uv.lock cloudbuild.yaml \
              .dockerignore .gcloudignore .gitignore scripts/deploy.sh \
              .github/workflows/test.yml || status=$?
            case "$status" in
              0) echo 'backend=false' >> "$GITHUB_OUTPUT" ;;
              1) echo 'backend=true' >> "$GITHUB_OUTPUT" ;;
              *) exit "$status" ;;
            esac
          fi
  deploy:
    name: Deploy backend to Cloud Run
    needs: [backend, ios, deployment-changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CARGUY_DEPLOY_ENABLED == 'true' && needs.deployment-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: carguy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip superseded backend changes
        id: current
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          latest=$(git rev-parse FETCH_HEAD)
          status=0
          git diff --quiet "$GITHUB_SHA" "$latest" -- \
            carguy/ Dockerfile pyproject.toml uv.lock cloudbuild.yaml \
            .dockerignore .gcloudignore .gitignore scripts/deploy.sh \
            .github/workflows/test.yml || status=$?
          case "$status" in
            0) echo 'deploy=true' >> "$GITHUB_OUTPUT" ;;
            1)
              echo 'deploy=false' >> "$GITHUB_OUTPUT"
              echo 'Newer backend changes exist on main; skipping this deployment.'
              ;;
            *) exit "$status" ;;
          esac
      - name: Authenticate to Google Cloud
        if: steps.current.outputs.deploy == 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: orakle-1792087003
          workload_identity_provider: ${{ vars.CARGUY_WIF_PROVIDER }}
          service_account: ${{ vars.CARGUY_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        if: steps.current.outputs.deploy == 'true'
      - name: Build and update the existing service image
        if: steps.current.outputs.deploy == 'true'
        run: bash scripts/deploy.sh --image-only
      - name: Verify public API health
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          api_url=$(gcloud run services describe carguy-api --project=orakle-1792087003 --region=us-west1 --format='value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 30 "$api_url/health" \
            | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["status"] == "ok" and h["storage"] == "firestore" and h["authenticationRequired"] is True and h["researchConfigured"] is True; print("Cloud Run health checks passed.")'
