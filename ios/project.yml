name: Carguy
options:
  bundleIdPrefix: com.karlmageddon
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    DEVELOPMENT_TEAM: ''
targets:
  Carguy:
    type: application
    platform: iOS
    sources: [Carguy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karlmageddon.Carguy
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose a car photo for offline study.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
  CarguyTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources: [CarguyTests]
    dependencies:
      - target: Carguy
schemes:
  Carguy:
    build:
      targets:
        Carguy: all
    test:
      targets: [CarguyTests]
